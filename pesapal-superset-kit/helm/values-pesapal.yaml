# Helm values for the official Superset chart (https://github.com/apache/superset/tree/master/helm/superset)
#   helm upgrade --install superset superset/superset -f values.yaml -f values-pesapal.yaml
image:
  repository: registry.example.com/pesapal/superset   # <- your registry
  tag: "5.0.0-pesapal.1"                              # <- the tag you built
  pullPolicy: IfNotPresent

configOverrides:
  pesapal_extensions: |
    FEATURE_FLAGS = {**globals().get("FEATURE_FLAGS", {}), "ENABLE_TEMPLATE_PROCESSING": True}

    def _dax_helper(name):
        def call(*args, **kwargs):
            from superset.semantic import dax
            return getattr(dax, name)(*args, **kwargs)
        call.__name__ = name
        return call

    JINJA_CONTEXT_ADDONS = {
        **globals().get("JINJA_CONTEXT_ADDONS", {}),
        **{n: _dax_helper(n) for n in ("dax_over", "dax_ok", "dax_num", "dax_partition")},
    }
