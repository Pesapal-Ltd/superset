<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: Inter, Helvetica, Arial, sans-serif; color: #323232;
      background: #F7F9FA; padding: 20px 24px 32px; font-size: 13px;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .sub { color: #888; margin-top: 4px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 18px 0 22px; }
    .kpi { background: #fff; border: 1px solid #E8E8E8; border-radius: 12px; padding: 14px 16px; }
    .kpi .label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: #888; }
    .kpi .val { font-size: 24px; font-weight: 700; margin: 6px 0 4px; }
    .kpi .note { font-size: 12px; color: #888; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-weight: 700; font-size: 12px; }
    .up { color: #2B6144; background: #EEF8F3; }
    .down { color: #A7323F; background: #FAEDEE; }
    .flat { color: #666; background: #F0F0F0; }
    h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
    h2 .progress { font-size: 12px; font-weight: 500; color: #888; }
    .tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
    .task {
      background: #fff; border: 1px solid #E8E8E8; border-left: 5px solid var(--c, #1FA8C9);
      border-radius: 12px; padding: 14px 16px; transition: opacity .2s;
    }
    .task.done { opacity: .45; }
    .task.done .t-title { text-decoration: line-through; }
    .t-head { display: flex; gap: 10px; align-items: flex-start; }
    .t-head input { margin-top: 3px; width: 16px; height: 16px; accent-color: #1B7C8C; cursor: pointer; }
    .num {
      flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--c, #1FA8C9);
      color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 12px;
    }
    .t-title { font-weight: 700; font-size: 14px; }
    .t-why { color: #666; margin-top: 3px; line-height: 1.45; }
    .t-body { margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11px; color: #999; font-weight: 600; padding: 4px 6px; border-bottom: 1px solid #EEE; }
    td { padding: 6px; border-bottom: 1px solid #F3F3F3; vertical-align: top; }
    td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
    .who { font-weight: 600; }
    .small { font-size: 11px; color: #999; }
    a.call {
      display: inline-block; padding: 2px 8px; border-radius: 8px; background: #E3F2F4; color: #1B7C8C;
      text-decoration: none; font-weight: 600; font-size: 11px; white-space: nowrap;
    }
    .clear { color: #2B6144; background: #EEF8F3; border-radius: 8px; padding: 8px 10px; }
    .tip { color: #444; background: #F7F9FA; border-radius: 8px; padding: 8px 10px; line-height: 1.5; }
    .foot { margin-top: 20px; color: #AAA; font-size: 11px; }
    .msg { background: #fff; border-radius: 12px; padding: 18px; color: #666; line-height: 1.6; }

    /* ----- drill-through (hidden page) ----- */
    [hidden] { display: none !important; }
    .alert {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: #FAEDEE; border: 1px solid #EFA1AA; color: #6F212A;
      border-radius: 12px; padding: 12px 16px; margin: 0 0 18px; font-size: 14px;
    }
    .link {
      background: none; border: 0; padding: 0; color: #1B7C8C; font: inherit; font-weight: 700;
      cursor: pointer; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap;
    }
    .alert .link { color: #A7323F; }
    .back {
      display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #DDD;
      border-radius: 8px; padding: 6px 12px; font: inherit; font-weight: 600; cursor: pointer; color: #323232;
    }
    .back:hover { background: #F0F0F0; }
    .crumbs { color: #999; font-size: 12px; margin: 14px 0 4px; }
    .panel { background: #fff; border: 1px solid #E8E8E8; border-radius: 12px; padding: 14px 16px; margin-top: 14px; }
    .bar { height: 8px; background: #F0F0F0; border-radius: 4px; min-width: 80px; }
    .bar span { display: block; height: 100%; border-radius: 4px; background: #E04355; }
    .filter { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .chip {
      border: 1px solid #DDD; background: #fff; border-radius: 14px; padding: 3px 10px;
      font: inherit; font-size: 12px; cursor: pointer;
    }
    .chip.on { background: #1B7C8C; border-color: #1B7C8C; color: #fff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (function () {
    const { rows } = window.supersetData;
    const user = window.supersetUser;
    const root = document.getElementById('root');
    const REQUIRED = ['order_number', 'order_date', 'sales', 'status', 'customer_name'];
    const missing = REQUIRED.filter(c => !(rows[0] && c in rows[0]));

    if (missing.length) {
      const got = Object.keys(rows[0] || {}).join(', ') || 'no rows';
      root.innerHTML = `<div class="msg">
        <b>Set the query to Raw records</b> with these columns: order_number, order_date, sales, status,
        customer_name, contact_first_name, contact_last_name, phone, country, product_line.
        Row limit 10000, then click <b>Update chart</b>.<br><br>
        Missing: <b>${missing.join(', ')}</b><br>Received: ${got.replace(/</g, '&lt;')}</div>`;
      return;
    }

    // ---------------- settings you can tweak ----------------
    const QUIET_DAYS = 90;        // customer counts as "quiet" after this many days without an order
    const STALE_IN_PROCESS = 14;  // In Process orders older than this need a shipping check
    const MAX_ITEMS = 5;          // rows shown per task
    // --------------------------------------------------------

    const DAY = 86400000;
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
    const money = v => {
      const a = Math.abs(v);
      return '$' + (a >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : a >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : v.toFixed(0));
    };
    const pct = v => `${(v * 100).toFixed(1)}%`;
    const toDate = v => new Date(typeof v === 'string' && /^\d+$/.test(v) ? +v : v);
    const fmtDate = d => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    const change = (cur, prev) => (prev ? (cur - prev) / Math.abs(prev) : null);
    const badge = c => c === null ? ''
      : `<span class="badge ${c > 0 ? 'up' : c < 0 ? 'down' : 'flat'}">${c > 0 ? '▲' : c < 0 ? '▼' : '■'} ${pct(Math.abs(c))}</span>`;
    const call = phone => phone
      ? `<a class="call" href="tel:${esc(String(phone).replace(/[^\d+]/g, ''))}">📞 ${esc(phone)}</a>`
      : '<span class="small">no phone</span>';

    // ---------- roll order lines up to orders ----------
    const orders = {};
    rows.forEach(r => {
      const d = toDate(r.order_date);
      if (isNaN(d)) return;
      const o = (orders[r.order_number] = orders[r.order_number] || {
        id: r.order_number, date: d, status: r.status, customer: r.customer_name,
        contact: [r.contact_first_name, r.contact_last_name].filter(Boolean).join(' '),
        phone: r.phone, country: r.country, total: 0, lines: [],
      });
      o.total += Number(r.sales) || 0;
      o.lines.push(r);
    });
    const list = Object.values(orders);
    const asOf = new Date(Math.max(...list.map(o => +o.date)));
    const age = o => Math.round((asOf - o.date) / DAY);

    // ---------- month-to-date vs the same days last month ----------
    const y = asOf.getUTCFullYear(), m = asOf.getUTCMonth(), dom = asOf.getUTCDate();
    const inMtd = (d, yy, mm) => d.getUTCFullYear() === yy && d.getUTCMonth() === mm && d.getUTCDate() <= dom;
    const prevY = m === 0 ? y - 1 : y, prevM = m === 0 ? 11 : m - 1;
    const mtd = list.filter(o => inMtd(o.date, y, m));
    const pmtd = list.filter(o => inMtd(o.date, prevY, prevM));
    const sum = a => a.reduce((t, o) => t + o.total, 0);
    const mtdRev = sum(mtd), pmtdRev = sum(pmtd);
    const aov = mtd.length ? mtdRev / mtd.length : 0;
    const paov = pmtd.length ? pmtdRev / pmtd.length : 0;

    const disputed = list.filter(o => o.status === 'Disputed').sort((a, b) => b.total - a.total);
    const onHold = list.filter(o => o.status === 'On Hold').sort((a, b) => b.total - a.total);
    const inProcess = list.filter(o => o.status === 'In Process' && age(o) >= STALE_IN_PROCESS)
      .sort((a, b) => a.date - b.date);
    const atRisk = sum(disputed) + sum(onHold);

    // ---------- customers gone quiet ----------
    const cust = {};
    list.forEach(o => {
      const c = (cust[o.customer] = cust[o.customer] || { name: o.customer, last: o.date, ltv: 0, orders: 0, contact: o.contact, phone: o.phone, country: o.country });
      c.ltv += o.total; c.orders += 1;
      if (o.date > c.last) { c.last = o.date; c.contact = o.contact; c.phone = o.phone; }
    });
    const quiet = Object.values(cust)
      .filter(c => (asOf - c.last) / DAY >= QUIET_DAYS)
      .sort((a, b) => b.ltv - a.ltv);

    // ---------- top customers this month ----------
    const mtdCust = {};
    mtd.forEach(o => {
      const c = (mtdCust[o.customer] = mtdCust[o.customer] || { name: o.customer, total: 0, orders: 0, contact: o.contact, phone: o.phone });
      c.total += o.total; c.orders += 1;
    });
    const topCust = Object.values(mtdCust).sort((a, b) => b.total - a.total);

    // ---------- product lines: this month vs last ----------
    let productTip = '';
    if ('product_line' in rows[0]) {
      const by = (arr) => {
        const t = {};
        arr.forEach(o => o.lines.forEach(l => { t[l.product_line] = (t[l.product_line] || 0) + (Number(l.sales) || 0); }));
        return t;
      };
      const cur = by(mtd), prev = by(pmtd);
      const lines = [...new Set([...Object.keys(cur), ...Object.keys(prev)])]
        .map(p => ({ p, cur: cur[p] || 0, prev: prev[p] || 0, ch: change(cur[p] || 0, prev[p] || 0) }))
        .filter(x => x.prev > 0);
      if (lines.length) {
        lines.sort((a, b) => a.ch - b.ch);
        const worst = lines[0], best = lines[lines.length - 1];
        productTip = `<div class="tip">
          <b>Push ${esc(worst.p)}</b>: ${money(worst.cur)} so far this month vs ${money(worst.prev)} at this point last month ${badge(worst.ch)}.
          Mention it on every call today.<br>
          <b>${esc(best.p)}</b> is your strongest line ${badge(best.ch)}. Offer it to customers already buying it.<br>
          <button class="link" data-go="drops" style="margin-top:6px">See all products that dropped →</button></div>`;
      }
    }

    // ---------- products that dropped (for the hidden drill-through page) ----------
    const hasProducts = 'product_line' in rows[0] || 'product_code' in rows[0];
    const productSales = (arr) => {
      const t = {};
      arr.forEach(o => o.lines.forEach(l => {
        const key = l.product_code || l.product_line;
        const p = (t[key] = t[key] || { key, code: l.product_code || '', line: l.product_line || '', total: 0 });
        p.total += Number(l.sales) || 0;
      }));
      return t;
    };
    const curP = productSales(mtd), prevP = productSales(pmtd);
    const drops = Object.keys(prevP)
      .map(k => {
        const now = curP[k] ? curP[k].total : 0;
        const before = prevP[k].total;
        return { ...prevP[k], now, before, diff: now - before, ch: change(now, before) };
      })
      .filter(p => p.diff < 0)
      .sort((a, b) => a.diff - b.diff);
    const totalDrop = drops.reduce((a, p) => a + p.diff, 0);

    // ---------- rendering helpers ----------
    const orderTable = (arr, extra) => arr.length
      ? `<table><tr><th>Order</th><th>Customer / contact</th><th class="r">Amount</th><th class="r">${extra}</th><th></th></tr>
         ${arr.slice(0, MAX_ITEMS).map(o => `<tr>
            <td>#${esc(o.id)}<div class="small">${fmtDate(o.date)}</div></td>
            <td><div class="who">${esc(o.customer)}</div><div class="small">${esc(o.contact)}${o.country ? ' · ' + esc(o.country) : ''}</div></td>
            <td class="r">${money(o.total)}</td>
            <td class="r">${age(o)}d</td>
            <td class="r">${call(o.phone)}</td></tr>`).join('')}
         </table>${arr.length > MAX_ITEMS ? `<div class="small" style="margin-top:6px">+ ${arr.length - MAX_ITEMS} more</div>` : ''}`
      : '<div class="clear">✓ All clear, nothing to do here.</div>';

    const custTable = (arr, cols) => arr.length
      ? `<table><tr><th>Customer / contact</th>${cols.map(c => `<th class="r">${c[0]}</th>`).join('')}<th></th></tr>
         ${arr.slice(0, MAX_ITEMS).map(c => `<tr>
            <td><div class="who">${esc(c.name)}</div><div class="small">${esc(c.contact)}</div></td>
            ${cols.map(col => `<td class="r">${col[1](c)}</td>`).join('')}
            <td class="r">${call(c.phone)}</td></tr>`).join('')}</table>`
      : '<div class="clear">✓ All clear, nothing to do here.</div>';

    const tasks = [
      {
        c: '#E04355', title: `Resolve ${disputed.length} disputed order${disputed.length === 1 ? '' : 's'}`,
        why: disputed.length ? `${money(sum(disputed))} is stuck in disputes. Call the biggest ones first and agree a fix today.` : 'No open disputes.',
        body: orderTable(disputed, 'Age'),
      },
      {
        c: '#FCC700', title: `Unblock ${onHold.length} order${onHold.length === 1 ? '' : 's'} on hold`,
        why: onHold.length ? `${money(sum(onHold))} waiting on the customer or on credit. Find out what is blocking each one.` : 'Nothing on hold.',
        body: orderTable(onHold, 'Age'),
      },
      {
        c: '#666666', title: `Check shipping on ${inProcess.length} slow order${inProcess.length === 1 ? '' : 's'}`,
        why: `In Process for ${STALE_IN_PROCESS}+ days. Confirm a delivery date with operations, then update the customer.`,
        body: orderTable(inProcess, 'Waiting'),
      },
      {
        c: '#1FA8C9', title: `Win back ${Math.min(quiet.length, MAX_ITEMS)} quiet customer${quiet.length === 1 ? '' : 's'}`,
        why: `No order in ${QUIET_DAYS}+ days, sorted by how much they have spent with us. Call to check in and share what's new.`,
        body: custTable(quiet, [
          ['Last order', c => `${Math.round((asOf - c.last) / DAY)}d ago`],
          ['Lifetime', c => money(c.ltv)],
        ]),
      },
      {
        c: '#5AC189', title: 'Thank this month\'s top customers',
        why: 'A quick thank-you call keeps them loyal and is a natural moment to suggest a re-order or upgrade.',
        body: custTable(topCust.slice(0, 3), [
          ['Orders', c => c.orders],
          ['This month', c => money(c.total)],
        ]),
      },
    ];
    if (productTip) {
      tasks.push({ c: '#FF7F44', title: 'Product focus for today', why: 'Based on this month vs the same days last month.', body: productTip });
    }

    const hour = new Date().getHours();
    const hello = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    const name = user && user.firstName ? `, ${esc(user.firstName)}` : '';
    const monthName = asOf.toLocaleDateString(undefined, { month: 'long' });

    const revChange = change(mtdRev, pmtdRev);
    const alert = hasProducts && drops.length
      ? `<div class="alert">
          <div>${revChange !== null && revChange < 0
            ? `<b>Sales are down ${pct(Math.abs(revChange))}</b> vs the same days last month.`
            : `<b>Sales are up overall</b>, but some products are slipping.`}
            ${drops.length} product${drops.length === 1 ? '' : 's'} sold less, ${money(Math.abs(totalDrop))} in total.</div>
          <button class="link" data-go="drops">See products that dropped →</button>
        </div>`
      : '';

    // Hidden page: every product that sold less than at this point last month
    const maxDrop = drops.length ? Math.abs(drops[0].diff) : 1;
    const lineNames = [...new Set(drops.map(p => p.line).filter(Boolean))].sort();
    const dropsPage = `
      <button class="back" data-go="main">← Back to briefing</button>
      <div class="crumbs">Briefing › Products that dropped</div>
      <h1>Products that dropped</h1>
      <div class="sub">${monthName} so far (to day ${dom}) vs the same days of last month ·
        ${drops.length} product${drops.length === 1 ? '' : 's'} · ${money(Math.abs(totalDrop))} lost</div>
      ${lineNames.length > 1 ? `<div class="filter">
          <button class="chip on" data-line="">All lines</button>
          ${lineNames.map(l => `<button class="chip" data-line="${esc(l)}">${esc(l)}</button>`).join('')}
        </div>` : ''}
      <div class="panel">
        ${drops.length ? `<table id="drop-table">
          <tr><th>Product</th><th>Line</th><th class="r">Last month</th><th class="r">This month</th>
              <th class="r">Change</th><th style="width:22%"></th></tr>
          ${drops.map(p => `<tr data-line="${esc(p.line)}">
              <td class="who">${esc(p.code || p.line)}</td>
              <td>${esc(p.line)}</td>
              <td class="r">${money(p.before)}</td>
              <td class="r">${money(p.now)}</td>
              <td class="r"><span class="badge down">▼ ${money(Math.abs(p.diff))}${p.ch !== null ? ` · ${pct(Math.abs(p.ch))}` : ''}</span></td>
              <td><div class="bar"><span style="width:${(Math.abs(p.diff) / maxDrop) * 100}%"></span></div></td>
            </tr>`).join('')}
        </table>` : '<div class="clear">✓ No product sold less than last month.</div>'}
      </div>
      <div class="foot">What to do: call the customers who usually buy these products (see "Win back quiet customers" on the briefing) and check stock or pricing on the biggest drops.</div>`;

    root.innerHTML = `
      <div id="view-drops" hidden>${dropsPage}</div>
      <div id="view-main">
      ${alert}
      <h1>${hello}${name} 👋</h1>
      <div class="sub">${new Date().toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}
        · Sales data up to ${fmtDate(asOf)}</div>

      <div class="kpis">
        <div class="kpi"><div class="label">${monthName} revenue so far</div>
          <div class="val">${money(mtdRev)}</div>
          <div class="note">${badge(change(mtdRev, pmtdRev))} vs same days last month (${money(pmtdRev)})</div></div>
        <div class="kpi"><div class="label">Orders this month</div>
          <div class="val">${mtd.length}</div>
          <div class="note">${badge(change(mtd.length, pmtd.length))} vs ${pmtd.length} last month</div></div>
        <div class="kpi"><div class="label">Average order value</div>
          <div class="val">${money(aov)}</div>
          <div class="note">${badge(change(aov, paov))} vs ${money(paov)}</div></div>
        <div class="kpi"><div class="label">Revenue needing action</div>
          <div class="val" style="color:${atRisk ? '#A7323F' : '#2B6144'}">${money(atRisk)}</div>
          <div class="note">${disputed.length} disputed · ${onHold.length} on hold</div></div>
      </div>

      <h2>Your priorities today <span class="progress" id="progress"></span></h2>
      <div class="tasks">
        ${tasks.map((t, i) => `
          <div class="task" style="--c:${t.c}">
            <div class="t-head">
              <div class="num">${i + 1}</div>
              <div style="flex:1"><div class="t-title">${t.title}</div><div class="t-why">${t.why}</div></div>
              <input type="checkbox" title="Mark as done" data-task="${i}">
            </div>
            <div class="t-body">${t.body}</div>
          </div>`).join('')}
      </div>
      <div class="foot">Tick tasks off as you go. Ticks reset when the dashboard is reloaded.</div>
      </div>`;

    // ---------- switching between the briefing and hidden pages ----------
    const views = { main: document.getElementById('view-main'), drops: document.getElementById('view-drops') };
    const go = (name) => {
      Object.entries(views).forEach(([k, el]) => { el.hidden = k !== name; });
      window.scrollTo(0, 0);
    };
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-go]');
      if (btn) go(btn.dataset.go);
      const chip = e.target.closest('.chip[data-line]');
      if (chip) {
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === chip));
        document.querySelectorAll('#drop-table tr[data-line]').forEach(tr => {
          tr.hidden = !!chip.dataset.line && tr.dataset.line !== chip.dataset.line;
        });
      }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') go('main'); });

    const boxes = [...document.querySelectorAll('input[data-task]')];
    const progress = document.getElementById('progress');
    const update = () => {
      const done = boxes.filter(b => b.checked).length;
      progress.textContent = `${done} of ${boxes.length} done`;
      boxes.forEach(b => b.closest('.task').classList.toggle('done', b.checked));
    };
    boxes.forEach(b => b.addEventListener('change', update));
    update();
  })();
  </script>
</body>
</html>
